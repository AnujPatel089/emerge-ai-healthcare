services:
  - type: web
    name: emergeai-backend
    env: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: RELOAD
        value: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: emergeai-frontend
    env: python
    rootDir: .
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: python frontend/run.py
    envVars:
      - key: API_URL
        sync: false